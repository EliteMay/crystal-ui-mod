plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
minecraft {
    mappings channel: 'official', version: minecraft_version
    // Produce Forge remapped jars for launcher/mods; dev runClient still uses source sets.
    reobf = true
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                prismglass { source sourceSets.main }
            }
        }
        client {}
    }
}
repositories { }
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}
tasks.named('processResources', ProcessResources).configure {
    def propertiesToExpand = [mod_version: mod_version]
    inputs.properties propertiesToExpand
    filesMatching('META-INF/mods.toml') { expand propertiesToExpand }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}
